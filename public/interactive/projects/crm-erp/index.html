<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Scalary X — Custom CRM + ERP Systems</title>
<script>
/* ══ 1) THEME — standalone, runs BEFORE paint, zero dependencies ══ */
(function(){
function rd(k,d){try{var v=localStorage.getItem(k);if(v==null)return d;v=String(v).replace(/"/g,'').trim().toLowerCase();return v||d}catch(e){return d}}
try{document.documentElement.setAttribute('data-theme',rd('sx_theme','light')==='dark'?'dark':'light')}catch(e){}
try{if(rd('sx_lang','en')==='ar'){document.documentElement.setAttribute('lang','ar');document.documentElement.setAttribute('dir','rtl')}}catch(e){}
/* global toggle — called by inline onclick, can never be undefined */
window.sxTheme=function(){
var d=document.documentElement.getAttribute('data-theme')==='dark';
var t=d?'light':'dark';
document.documentElement.setAttribute('data-theme',t);
try{localStorage.setItem('sx_theme',t)}catch(e){}
};
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
--navy:#0A1B33;--navy2:#10294D;--deep:#12336B;--blue:#1E56C8;--blue-h:#1747A8;
--ink:#0A1B33;--ink2:#33455F;--mut:#66758D;--faint:#8B99AF;
--bg:#F5F7FA;--card:#FFFFFF;--sky:#EDF3FB;--sky2:#DFEAF8;--line:#E4EAF2;--line2:#D2DBE8;
--pos:#0E8A5F;--posbg:#E5F4ED;--neg:#BF3B3B;--negbg:#F9ECEC;--warn:#A9740E;--warnbg:#FBF2DF;
--wa:#0E8A5F;--wa-h:#0B7350;
--r:14px;--sh:0 1px 2px rgba(10,27,51,.05),0 8px 28px -8px rgba(10,27,51,.10);
--sh-lg:0 2px 4px rgba(10,27,51,.06),0 24px 60px -16px rgba(10,27,51,.22);
--fd:'Sora',sans-serif;--fb:'Instrument Sans',sans-serif;--fm:'IBM Plex Mono',monospace;
}
html[data-theme="dark"]{
--bg:#0C1626;--card:#111F36;--sky:#152A47;--sky2:#1D3659;--line:#1E2F4D;--line2:#2B405F;
--ink:#E9EEF6;--ink2:#C3CFE0;--mut:#8DA0BC;--faint:#66799B;--deep:#9FC2F2;
--pos:#41C98D;--posbg:#0F2C20;--neg:#F08383;--negbg:#301616;--warn:#E5B04F;--warnbg:#2B230F;
--wa:#12805C;--wa-h:#0E6B4C;
--sh:0 1px 2px rgba(0,0,0,.35),0 10px 30px -10px rgba(0,0,0,.5);
--sh-lg:0 2px 6px rgba(0,0,0,.4),0 28px 70px -18px rgba(0,0,0,.65);
color-scheme:dark;
}
html[data-theme="dark"] body{background:var(--bg);color:var(--ink)}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:var(--fb);background:var(--bg);color:var(--ink);font-size:15.5px;line-height:1.55;-webkit-font-smoothing:antialiased;transition:background-color .25s ease,color .25s ease}
html[dir="rtl"] body,html[dir="rtl"] h1,html[dir="rtl"] h2,html[dir="rtl"] h3,html[dir="rtl"] h4{font-family:'IBM Plex Sans Arabic','Instrument Sans',sans-serif}
html[dir="rtl"] h1,html[dir="rtl"] h2,html[dir="rtl"] h3,html[dir="rtl"] h4{letter-spacing:0}
img{max-width:100%}button{font-family:inherit;cursor:pointer}input,select,textarea{font-family:inherit;font-size:inherit}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:4px}
.wrap{max-width:1180px;margin:0 auto;padding:0 28px}
.mono{font-family:var(--fm);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
h1,h2,h3,h4{font-family:var(--fd);letter-spacing:-.015em;line-height:1.16;font-weight:600}
.kicker{font-family:var(--fm);font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--blue);font-weight:600}
html[dir="rtl"] .kicker{letter-spacing:.04em;font-family:'IBM Plex Sans Arabic',sans-serif}
svg{display:block}
.rv{transition:opacity .7s ease,transform .7s cubic-bezier(.2,.7,.3,1)}
html.anim .rv{opacity:0;transform:translateY(26px)}
html.anim .rv.in{opacity:1;transform:none}
html[dir="rtl"] #toasts{right:auto;left:24px}
html[dir="rtl"] .wa-float{right:20px;left:auto}
html[dir="rtl"] .mnav .links{margin-left:0;margin-right:auto}
html[dir="rtl"] .live{margin-left:0;margin-right:auto}
html[dir="rtl"] .statline>div{border-right:none;border-left:1px solid var(--line)}
html[dir="rtl"] .statline>div:last-child{border-left:none}
html[dir="rtl"] .trust div{border-right:none;border-left:1px solid var(--line)}
html[dir="rtl"] .trust div:last-child{border-left:none}
html[dir="rtl"] .callout{border-left:none;border-right:4px solid var(--blue)}
html[dir="rtl"] .solve-tab{text-align:right;border-left:none;border-right:2px solid var(--line2)}
html[dir="rtl"] .solve-tab.on{border-right-color:var(--blue);background:linear-gradient(to left,rgba(30,86,200,.07),transparent)}
html[dir="rtl"] .farrow svg{transform:scaleX(-1)}
html[dir="rtl"] .ccard .cs,html[dir="rtl"] .vbar .vt b,html[dir="rtl"] .badge{font-family:'IBM Plex Sans Arabic',sans-serif}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--navy);background:var(--navy);color:#fff;font-weight:600;font-size:14.5px;padding:12px 22px;border-radius:10px;transition:transform .18s,background .18s,box-shadow .18s;white-space:nowrap}
.btn:hover{background:var(--navy2);transform:translateY(-1px);box-shadow:0 10px 24px -10px rgba(10,27,51,.45)}
.btn.blue{background:var(--blue);border-color:var(--blue)}.btn.blue:hover{background:var(--blue-h)}
.btn.wa{background:var(--wa);border-color:var(--wa)}.btn.wa:hover{background:var(--wa-h)}
.btn.o{background:transparent;color:var(--ink);border-color:var(--line2)}.btn.o:hover{background:var(--card);border-color:var(--faint);box-shadow:var(--sh)}
.btn.sm{padding:8px 14px;font-size:13px;border-radius:8px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:3.5px 10px;border-radius:99px;font-family:var(--fm)}
.b-blue{background:var(--sky);color:var(--deep)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);transition:background-color .25s,border-color .25s}
.pad{padding:22px 24px}
.tbtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line2);background:var(--card);display:grid;place-items:center;color:var(--ink2);transition:.15s;flex:none;grid-auto-flow:column}
.tbtn:hover{border-color:var(--faint);transform:translateY(-1px)}
.tbtn.lang{width:auto;padding:0 12px;font-weight:700;font-size:13px;font-family:var(--fd)}
.igbtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line2);background:var(--card);display:grid;place-items:center;color:var(--ink2);transition:.15s;flex:none}
.igbtn:hover{color:var(--blue);border-color:var(--blue)}
/ theme icons — swapped by pure CSS, cannot break /
.tbtn .ic-sun{display:none}
html[data-theme="dark"] .tbtn .ic-sun{display:block}
html[data-theme="dark"] .tbtn .ic-moon{display:none}
.mnav{position:sticky;top:0;z-index:60;background:rgba(245,247,250,.86);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);transition:background-color .25s}
html[data-theme="dark"] .mnav{background:rgba(12,22,38,.88)}
.mnav .wrap{display:flex;align-items:center;gap:10px;height:68px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--fd);font-weight:700;font-size:19px;letter-spacing:-.02em}
.logo small{font-family:var(--fm);font-weight:500;font-size:10px;color:var(--mut);letter-spacing:.14em;margin-top:4px}
html[dir="rtl"] .logo small{letter-spacing:.04em}
.logo-slot{display:inline-flex;align-items:center}
.logo-slot:empty{display:none}
.logo-slot img{height:34px;width:auto;display:block}
.mnav .links{display:flex;gap:22px;margin-left:auto}
.mnav .links a{font-size:14px;font-weight:500;color:var(--ink2)}
.mnav .links a:hover{color:var(--blue)}
@media(max-width:960px){.mnav .links{display:none}.mnav .hide-s{display:none}}
.hero{padding:84px 0 96px;overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:1.02fr 1fr;gap:64px;align-items:center}
@media(max-width:1080px){.hero .wrap{grid-template-columns:1fr;gap:52px}}
.hero h1{font-size:clamp(34px,4.4vw,54px);margin:18px 0 20px}
.hero h1 em{font-style:normal;color:var(--blue)}
.hero p.sub{font-size:17.5px;color:var(--ink2);max-width:540px;margin-bottom:30px}
.hero-cta{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.hero-alt{font-size:14px;font-weight:600;color:var(--blue);display:inline-flex;gap:6px;align-items:center;margin-bottom:30px}
.hero-alt:hover{text-decoration:underline}
.hero-meta{display:flex;gap:26px;flex-wrap:wrap;font-size:13px;color:var(--mut)}
.hero-meta b{display:block;font-family:var(--fd);font-size:17px;color:var(--ink)}
@media(max-width:640px){.hero-cta .btn{width:100%;justify-content:center}}
.pv-scene{perspective:1400px}
.pv{transform-style:preserve-3d;transition:transform .35s cubic-bezier(.2,.7,.3,1)}
.pv-main{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh-lg);padding:20px}
.pv-head{display:flex;align-items:center;gap:10px;padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:16px}
.pv-head .nm{font-weight:600;font-size:14px}.pv-head .sb{font-size:11.5px;color:var(--mut);font-family:var(--fm)}
html[dir="rtl"] .pv-head .sb{font-family:'IBM Plex Sans Arabic',sans-serif}
.live{display:inline-flex;align-items:center;gap:6px;font-family:var(--fm);font-size:10.5px;color:var(--pos);font-weight:600;letter-spacing:.08em;margin-left:auto}
.pv-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.pv-kpi{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
.pv-kpi .l{font-size:10.5px;color:var(--mut);text-transform:uppercase;font-family:var(--fm)}
html[dir="rtl"] .pv-kpi .l{font-family:'IBM Plex Sans Arabic',sans-serif;letter-spacing:0}
.pv-kpi .v{font-family:var(--fm);font-weight:600;font-size:17px;margin-top:2px}
.pv-kpi .d{font-size:11px;font-weight:600;margin-top:2px}
.up{color:var(--pos)}.dn{color:var(--neg)}
.pv-auto{background:var(--sky);border:1px solid var(--sky2);border-radius:10px;padding:11px 13px;font-size:12.5px;color:var(--deep);margin-top:12px;line-height:1.5}
.pv-auto b{font-family:var(--fm);font-size:10px;letter-spacing:.1em;color:var(--pos);display:block;margin-bottom:2px}
html[dir="rtl"] .pv-auto b{font-family:'IBM Plex Sans Arabic',sans-serif;letter-spacing:.04em}
.pv-chips{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.pv-chip{display:flex;gap:9px;align-items:center;font-size:12.5px;font-weight:600;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 12px}
.sec{padding:96px 0}
.sec.alt{background:var(--card);border-top:1px solid var(--line);border-bottom:1px solid var(--line);transition:background-color .25s}
.sec-head{max-width:700px;margin-bottom:52px}
.sec-head h2{font-size:clamp(27px,3vw,38px);margin:14px 0 14px}
.sec-head p{color:var(--ink2);font-size:16.5px}
.prob-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:56px;align-items:center}
@media(max-width:1080px){.prob-grid{grid-template-columns:1fr}}
.scattered{position:relative;height:380px}
.snode{position:absolute;background:var(--card);border:1px dashed var(--line2);border-radius:11px;padding:10px 15px;font-size:13px;font-weight:600;color:var(--ink2);box-shadow:var(--sh);display:flex;gap:8px;align-items:center;animation:drift 7s ease-in-out infinite;white-space:nowrap}
.snode svg{color:var(--faint);flex:none}
@keyframes drift{0%,100%{transform:translateY(0) rotate(var(--rot))}50%{transform:translateY(-7px) rotate(var(--rot))}}
.scenter{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:150px;height:150px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;text-align:center;font-family:var(--fd);font-weight:600;font-size:13px;line-height:1.3;z-index:2;box-shadow:var(--sh-lg);padding:12px}
.scenter .q{font-family:var(--fm);font-size:26px;display:block;margin-bottom:2px;color:#9DB6E4}
.pains{margin-top:26px;display:grid;gap:10px}
.pains li{list-style:none;display:flex;gap:10px;font-size:14.5px;color:var(--ink2);align-items:baseline}
.pains li::before{content:"";width:6px;height:6px;background:var(--neg);border-radius:1px;flex:none;transform:translateY(-2px) rotate(45deg)}
.flow{display:flex;align-items:stretch;gap:0;overflow-x:auto;padding:12px 2px 20px}
.fnode{flex:1;min-width:140px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 16px}
.fnode .ic{width:36px;height:36px;border-radius:9px;background:var(--sky);color:var(--blue);display:grid;place-items:center;margin-bottom:12px}
.fnode h4{font-size:14.5px;margin-bottom:5px}
.fnode p{font-size:12.5px;color:var(--mut);line-height:1.45}
.farrow{display:grid;place-items:center;color:var(--line2);padding:0 6px;flex:none}
@media(max-width:900px){.farrow{transform:rotate(90deg)}}
.callout{display:flex;gap:16px;align-items:flex-start;background:var(--sky);border:1px solid var(--sky2);border-left:4px solid var(--blue);border-radius:14px;padding:22px 26px;margin-top:34px}
.callout .cic{width:40px;height:40px;border-radius:10px;background:var(--card);color:var(--blue);display:grid;place-items:center;flex:none}
.callout h4{font-size:15.5px;margin-bottom:5px}
.callout p{font-size:14px;color:var(--ink2)}
.statline{display:flex;border:1px solid var(--line);border-radius:14px;background:var(--card);overflow:hidden;margin-top:34px}
.statline>div{flex:1;padding:24px 26px;border-right:1px solid var(--line)}
.statline>div:last-child{border-right:none}
.statline b{font-family:var(--fd);font-size:22px;display:block}
.statline span{font-size:12.5px;color:var(--mut)}
@media(max-width:860px){.statline{flex-direction:column}.statline>div{border-right:none;border-left:none;border-bottom:1px solid var(--line)}}
.solves{display:grid;grid-template-columns:300px 1fr;gap:40px;align-items:start}
@media(max-width:960px){.solves{grid-template-columns:1fr}}
.solve-tab{width:100%;text-align:left;background:none;border:none;border-left:2px solid var(--line2);padding:13px 18px;font-size:15px;font-weight:600;color:var(--mut);transition:.2s;display:flex;gap:12px;align-items:center}
.solve-tab:hover{color:var(--ink)}
.solve-tab.on{color:var(--blue);border-left-color:var(--blue);background:linear-gradient(to right,rgba(30,86,200,.07),transparent)}
.solve-panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:30px 32px;min-height:340px}
.solve-panel h3{font-size:21px;margin-bottom:6px}
.solve-panel .lede{color:var(--mut);font-size:14px;margin-bottom:18px}
.solve-panel ul{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:9px 24px;margin-bottom:22px}
@media(max-width:640px){.solve-panel ul{grid-template-columns:1fr}}
.solve-panel ul li{font-size:14px;color:var(--ink2);display:flex;gap:9px;align-items:baseline}
.solve-panel ul li::before{content:"";width:5px;height:5px;background:var(--blue);border-radius:50%;flex:none;transform:translateY(-2px)}
.vbar{margin-bottom:13px}
.vbar .vt{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px;gap:10px}
.vbar .vt span{font-weight:600;color:var(--ink2)}
.vbar .vt b{font-family:var(--fm);font-weight:600;color:var(--deep);white-space:nowrap}
.vbar .vb{height:9px;background:var(--bg);border-radius:99px;overflow:hidden}
.vbar .vb i{display:block;height:100%;border-radius:99px;background:var(--blue)}
.vrow{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:13.5px;padding:11px 14px;background:var(--bg);border-radius:9px;margin-bottom:8px}
.vrow .vl{font-weight:600;color:var(--ink2);display:flex;gap:9px;align-items:center;min-width:0}
.vrow .vl svg{flex:none}
.vrow b{font-family:var(--fm);white-space:nowrap}
.vstats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.vstat{background:var(--bg);border-radius:10px;padding:14px 16px}
.vstat .l{font-size:11.5px;color:var(--mut);font-weight:600}
.vstat .v{font-family:var(--fm);font-weight:600;font-size:19px;margin-top:2px}
.vnote{font-size:12px;color:var(--mut);margin-top:10px;display:flex;gap:8px;align-items:center}
.mbars{display:flex;align-items:flex-end;gap:10px;height:120px;padding-top:6px}
.mbars .mb{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.mbars .mb i{display:block;width:100%;max-width:38px;border-radius:6px 6px 0 0;background:var(--blue)}
.mbars .mb span{font-size:10.5px;color:var(--faint);font-family:var(--fm)}
.contact-grid{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:18px}
@media(max-width:1080px){.contact-grid{grid-template-columns:1fr}}
.ccard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px 30px;display:flex;gap:18px;align-items:flex-start;box-shadow:var(--sh);transition:transform .2s,box-shadow .2s}
.ccard:hover{transform:translateY(-3px);box-shadow:var(--sh-lg)}
.ccard.primary{border-color:var(--wa);box-shadow:0 0 0 1px var(--wa),var(--sh)}
.ccard .cic{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;flex:none}
.ccard h3{font-size:18px;margin-bottom:6px}
.ccard p{font-size:13.5px;color:var(--ink2);margin-bottom:16px}
.ccard .cs{font-size:12px;color:var(--mut);font-family:var(--fm);margin-top:12px}
.consult-strip{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--sky);border:1px solid var(--sky2);border-radius:12px;padding:16px 22px;margin-top:18px;font-size:14.5px;font-weight:600;color:var(--deep)}
.contact-note{display:flex;gap:10px;align-items:center;margin-top:18px;color:var(--mut);font-size:13.5px}
.field{margin-bottom:18px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:7px;color:var(--ink2)}
.field label span{color:var(--neg)}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line2);border-radius:9px;padding:11px 14px;font-size:14.5px;background:var(--card);color:var(--ink)}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(30,86,200,.12)}
.field .err{color:var(--neg);font-size:12.5px;margin-top:5px;display:none}
.field.bad input,.field.bad textarea,.field.bad select{border-color:var(--neg)}
.field.bad .err{display:block}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 20px}
@media(max-width:640px){.form-grid{grid-template-columns:1fr}}
.req-note{font-size:12.5px;color:var(--mut);margin-top:14px}
.success-box{background:var(--posbg);border:1px solid #BFE3D2;border-radius:12px;padding:28px;text-align:center}
html[data-theme="dark"] .success-box{border-color:#1E4634}
.success-box .big{font-family:var(--fd);font-size:20px;font-weight:600;color:var(--pos);margin:10px 0 6px}
.trust{display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:14px;background:var(--card);overflow:hidden}
.trust div{flex:1;min-width:200px;padding:22px 24px;font-size:14px;font-weight:600;color:var(--ink2);border-right:1px solid var(--line);display:flex;gap:10px;align-items:center}
.trust div:last-child{border-right:none}
.trust svg{color:var(--blue);flex:none}
.band{background:var(--navy);border-radius:20px;color:#fff;padding:64px 56px;display:flex;gap:40px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.band h2{font-size:clamp(24px,3vw,34px);max-width:560px}
.band p{color:#AFC2E4;margin-top:10px;font-size:15.5px;max-width:520px}
.band .btn.wa{background:var(--wa);border-color:var(--wa)}
.band .btn.o{background:transparent;color:#fff;border-color:rgba(255,255,255,.35)}
